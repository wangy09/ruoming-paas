# ================================================================
# 若茗 PaaS - 生产环境 Docker Compose
# Author: ruoming
# 使用：docker-compose -f docker-compose.prod.yml up -d
# ================================================================

version: "3.9"

services:
  # ── 前端构建（仅构建，产物写入 volume）─────────────────────────
  frontend-builder:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: builder           # 只运行到 builder 阶段
      args:
        VITE_API_BASE_URL: /api
    container_name: ruoming_frontend_builder
    volumes:
      - frontend_dist:/app/dist  # 将构建产物挂载到 volume
    command: sh -c "cp -r /app/dist/. /app/dist/ && echo 'Build complete'"
    restart: "no"

  # ── Nginx 反向代理 ───────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: ruoming_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro      # SSL 证书挂载
      - frontend_dist:/usr/share/nginx/html:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend-builder
    networks:
      - ruoming_net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s

  # ── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ruoming_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./postgres-backup:/backup          # 备份目录
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5
    networks:
      - ruoming_net

  # ── Redis ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ruoming_redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
    networks:
      - ruoming_net

  # ── 后端 API（多实例）───────────────────────────────────────────
  backend:
    image: ruoming/paas-backend:${APP_VERSION:-latest}
    restart: always
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DEBUG: "false"
      LOG_JSON: "true"
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    deploy:
      replicas: 2                           # 双实例，可横向扩展
      resources:
        limits:
          cpus: "2"
          memory: 2G
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ruoming_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local
  frontend_dist:
    driver: local
  nginx_logs:
    driver: local

networks:
  ruoming_net:
    driver: bridge
