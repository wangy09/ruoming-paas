[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ruoming-paas"
version = "2.0.0"
description = "若茗 PaaS - 企业级 AI 应用开发底座"
authors = [{ name = "ruoming" }]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Web 框架
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    # 数据库
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    # Redis
    "redis[hiredis]>=5.0.4",
    # 配置
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # 认证
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    # 日志
    "structlog>=24.1.0",
    "loguru>=0.7.2",
    # 限流
    "slowapi>=0.1.9",
    # AI
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.2.0",
    "openai>=1.30.0",
    # 向量数据库 (pgvector)
    "pgvector>=0.3.0",
    # 文档解析
    "pypdf2>=3.0.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24.0",
    "beautifulsoup4>=4.12.0",
    # 工具
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "python-jose[cryptography]>=3.3.0",
    "email-validator>=2.1.0",
    "aiofiles>=23.2.1",
    "Pillow>=10.3.0",
    # 加解密
    "cryptography>=42.0.0",
    # 任务队列
    "arq>=0.25.0",
    "celery>=5.4.0",
    # 监控
    "prometheus-client>=0.20.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "factory-boy>=3.3.0",
    "pip-licenses>=4.4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
